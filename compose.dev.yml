---
services:
  db:
    image: postgres:18.4
    container_name: dutyy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - 'dutyy_db_data:/var/lib/postgresql'

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ghcr.io/oatmeal4breakfast/dutyy-api:latest
    command: ['alembic', 'upgrade', 'head']
    restart: 'no'
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      ENV: ${ENV}
      RELOAD: ${RELOAD}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/oatmeal4breakfast/dutyy-api:latest
    container_name: dutyy_api
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      ENV: ${ENV}
      RELOAD: ${RELOAD}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  dutyy_db_data:
